services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      # Loads the Wyvern RC Club demo data into a fresh database
      SPRING_PROFILES_ACTIVE: demo
      RCTIMING_DATA_DIR: /app/data/db
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIGRldmVsb3BtZW50IHNlY3JldCBrZXkgdGhhdCBtdXN0IGJlIGF0IGxlYXN0IDI1NiBiaXRz}
      STORAGE_LOCAL_PATH: /app/data/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost/storage
      TTS_ENDPOINT: piper:10200
      TTS_DEFAULT_VOICE: en_GB-alan-medium
      TTS_ENABLED: "true"
    volumes:
      - app_db:/app/data/db
      - app_uploads:/app/data/uploads
    depends_on:
      piper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy

  piper:
    image: rhasspy/wyoming-piper:latest
    volumes:
      - piper_data:/data
    command: >
      --voice en_GB-alan-medium
      --voice en_GB-cori-high
      --voice en_US-amy-medium

  fake-decoder:
    build:
      context: .
      dockerfile: docker/fake-decoder/Dockerfile
    command: >
      --mode=generative
      --port=5100
      --transponders=101,102,103,104,105,106,107,108
      --interval-ms=13000
      --jitter-ms=2500

volumes:
  app_db:
  app_uploads:
  piper_data:
