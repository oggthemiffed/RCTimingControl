spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # Dev seeds are versioned 1000+, so a seeded dev database has a higher version than new
    # migrations. Out-of-order lets migrations added after the seed still apply.
    out-of-order: true

rctiming:
  database:
    # Relative to the backend's working directory (app/), so `make clean-db` can wipe it
    data-directory: ./data/db
    migration-locations: db/migration, db/seed

tts:
  endpoint: localhost:10200
