spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcyBpcyBhIGRldmVsb3BtZW50IHNlY3JldCBrZXkgdGhhdCBtdXN0IGJlIGF0IGxlYXN0IDI1NiBiaXRz}
    access-token-ttl-ms: 900000
    refresh-token-ttl-ms: 604800000
  grpc:
    port: 9090

storage:
  local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/storage}

tts:
  endpoint: ${TTS_ENDPOINT:piper:10200}
  defaultVoice: ${TTS_DEFAULT_VOICE:en_GB-alan-medium}
  enabled: ${TTS_ENABLED:true}
  # Piper locale prefixes to show in the voice picker (e.g. en_GB, en_US).
  # Leave empty to auto-detect from the JVM system locale.
  locales: ${TTS_LOCALES:}
