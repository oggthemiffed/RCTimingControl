services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rctiming
      POSTGRES_USER: rctiming
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rctiming_trial}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rctiming -d rctiming"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-seed:
    image: ghcr.io/oggthemiffed/rctimingcontrol/seed:${RCTIMING_VERSION:?Set RCTIMING_VERSION in .env}
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: rctiming
      PGPASSWORD: ${POSTGRES_PASSWORD:-rctiming_trial}
      PGDATABASE: rctiming
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ghcr.io/oggthemiffed/rctimingcontrol/app:${RCTIMING_VERSION:?Set RCTIMING_VERSION in .env}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rctiming
      SPRING_DATASOURCE_USERNAME: rctiming
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rctiming_trial}
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIGRldmVsb3BtZW50IHNlY3JldCBrZXkgdGhhdCBtdXN0IGJlIGF0IGxlYXN0IDI1NiBiaXRz}
      STORAGE_LOCAL_PATH: /app/data/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost/storage
      TTS_ENDPOINT: piper:10200
      TTS_DEFAULT_VOICE: en_GB-alan-medium
      TTS_ENABLED: "true"
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: 25
      SPRING_MAIL_TEST_CONNECTION: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    volumes:
      - app_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      piper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    image: ghcr.io/oggthemiffed/rctimingcontrol/frontend:${RCTIMING_VERSION:?Set RCTIMING_VERSION in .env}
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy

  piper:
    image: rhasspy/wyoming-piper:latest
    volumes:
      - piper_data:/data
    command: >
      --voice en_GB-alan-medium
      --voice en_GB-cori-high
      --voice en_US-amy-medium

  fake-decoder:
    image: ghcr.io/oggthemiffed/rctimingcontrol/fake-decoder:${RCTIMING_VERSION:?Set RCTIMING_VERSION in .env}
    command: >
      --mode=generative
      --port=5100
      --transponders=101,102,103,104,105,106,107,108
      --interval-ms=13000
      --jitter-ms=2500

volumes:
  pgdata:
  app_uploads:
  piper_data:
