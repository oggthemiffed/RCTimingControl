# localday: the offline race-day application. Runs standalone on a venue laptop with no
# internet connectivity and no dependency on the app/ module's database or migrations.
server:
  port: 8081

spring:
  application:
    name: localday
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    # Generous shutdown timeout — the embedded PostgreSQL bean needs time to stop cleanly
    # (pg_ctl stop) before the JVM exits, or a laptop lid-close could still corrupt data.
    timeout-per-shutdown-phase: 30s

localday:
  datasource:
    embedded-postgres:
      # Real on-disk path under the module's runtime working directory — NOT tmpfs/in-memory.
      # Durability across an unclean shutdown is the entire reason embedded Postgres was chosen
      # over H2 for this module; an in-memory data directory would defeat that purpose.
      data-directory: ${LOCALDAY_PG_DATA_DIR:./data/localday-pg}
  decoder:
    # RC-4 text protocol (firmware < 4.5) — port 5100 is the confirmed club-hardware default,
    # matching forwarder.properties' forwarder.decoder.port default.
    host: ${LOCALDAY_DECODER_HOST:localhost}
    port: ${LOCALDAY_DECODER_PORT:5100}
  # Extra CSP connect-src origin for the future cloud-sync channel (U6 local auth's
  # LocalSecurityConfig). Empty by default — no additional origin is appended to the CSP until a
  # later unit actually wires up cloud sync.
  cloud-sync-origin: ${LOCALDAY_CLOUD_SYNC_ORIGIN:}
